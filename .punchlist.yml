# punchlist plugin config. Formats + meaning: the plugin's reference/formats.md
docs_dir: docs
base_branch: main
branch_prefix: punchlist/
push: never            # never | allowed — whether sessions may push
owner: maintainer      # who "Waiting on" means
build_log_since: 2026-09-23   # build-log entries before this are exempt from the length budget
gates:                 # every command must pass before a unit commits
  - run: just check
budgets:
  state_lines: 120
  punchlist_lines: 250
  build_log_entry_lines: 15
  stale_later_days: 60
